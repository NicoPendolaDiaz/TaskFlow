<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow | Nico - Enterprise Solutions</title>
    <!-- Google Fonts: Poppins & Inter -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Bootstrap 5.3 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-dark text-white">
    <div class="glass-background"></div>

    <nav class="navbar navbar-expand-lg glass-header sticky-top">
      <div class="container">
        <a class="navbar-brand fw-bold text-cyan" href="#">
          <span class="neon-glow">TASK</span>FLOW
        </a>
        <div class="ms-auto d-flex align-items-center">
          <span class="badge bg-electric-blue me-2">Módulo 4</span>
          <span class="text-secondary small">Nico Péndola</span>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <div class="row g-4">
        <!-- Columna Izquierda: Formulario e Info -->
        <aside class="col-lg-4">
          <div class="glass-card p-4 mb-4">
            <h2 class="h4 mb-4 text-cyan text-uppercase fw-bold">
              Nueva Tarea
            </h2>
            <form id="taskForm">
              <div class="mb-3">
                <label for="taskTitle" class="form-label small text-secondary"
                  >Título de la Tarea</label
                >
                <input
                  type="text"
                  class="form-control glass-input"
                  id="taskTitle"
                  placeholder="Ej: Refactorizar API"
                  required
                />
              </div>
              <div class="mb-3">
                <label
                  for="taskCategory"
                  class="form-label small text-secondary"
                  >Categoría</label
                >
                <select
                  class="form-select glass-input"
                  id="taskCategory"
                  required
                >
                  <option value="Frontend">Frontend</option>
                  <option value="Backend">Backend</option>
                  <option value="Design">Diseño</option>
                  <option value="Security">Seguridad</option>
                </select>
              </div>
              <div class="mb-3">
                <label
                  for="taskDescription"
                  class="form-label small text-secondary"
                  >Descripción</label
                >
                <textarea
                  class="form-control glass-input"
                  id="taskDescription"
                  rows="3"
                  placeholder="Detalles de la tarea..."
                ></textarea>
              </div>
              <button
                type="submit"
                class="btn btn-cyan w-100 fw-bold py-2 shadow-neon"
              >
                AGREGAR TAREA
              </button>
            </form>
          </div>

          <div class="glass-card p-4">
            <h3 class="h6 text-secondary text-uppercase fw-bold mb-3">
              Estadísticas
            </h3>
            <div class="d-flex justify-content-between mb-2">
              <span>Total:</span>
              <span id="statTotal" class="fw-bold">0</span>
            </div>
            <div class="d-flex justify-content-between">
              <span>Completadas:</span>
              <span id="statCompleted" class="text-cyan fw-bold">0</span>
            </div>
          </div>
        </aside>

        <!-- Columna Derecha: Listado -->
        <section class="col-lg-8">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h4 text-uppercase fw-bold m-0">
              <span class="text-cyan">Task</span> List
            </h2>
            <div class="btn-group shadow-sm">
              <button
                class="btn btn-outline-secondary btn-sm active"
                data-filter="all"
              >
                Todas
              </button>
              <button
                class="btn btn-outline-secondary btn-sm"
                data-filter="pending"
              >
                Pendientes
              </button>
              <button
                class="btn btn-outline-secondary btn-sm"
                data-filter="completed"
              >
                Completadas
              </button>
            </div>
          </div>

          <div id="taskList" class="row row-cols-1 g-3">
            <!-- Tareas se inyectarán aquí dinámicamente -->
            <div class="col text-center py-5 text-secondary" id="emptyState">
              <p class="mb-0">No hay tareas registradas. Empieza hoy mismo.</p>
            </div>
          </div>
        </section>
      </div>
    </main>

    <!-- Modal de Sugerencia (API) -->
    <div class="modal fade" id="apiModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content glass-card">
          <div class="modal-header border-0">
            <h5 class="modal-title text-cyan fw-bold">💡 SUGERENCIA DEL DÍA</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body text-center p-4">
            <p id="apiContent" class="fs-5 italic"></p>
            <hr class="border-secondary opacity-25" />
            <p class="small text-secondary mb-0">
              - Generado asíncronamente para Nico -
            </p>
          </div>
        </div>
      </div>
    </div>

    <footer
      class="container text-center py-4 border-top border-secondary mt-5 opacity-50"
    >
      <p class="small mb-0">
        &copy; 2026 Nico Péndola Díaz | TaskFlow Enterprise
      </p>
    </footer>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Modular scripts -->
    <script type="module" src="script.js"></script>
  </body>
</html>
